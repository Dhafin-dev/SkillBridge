<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SkillBridge Official Logo Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      gap: 32px;
      padding: 40px;
    }
    .card {
      background: white;
      padding: 32px 48px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">1. Exact App Icon (Square)</div>
    <img src="/skillbridge-logo-exact.svg" width="160" height="160" alt="Icon">
    <p style="font-size: 12px; color: #94a3b8; margin: 0;">File: public/skillbridge-logo-exact.svg</p>
  </div>

  <div class="card">
    <div class="title">2. Exact Navbar Brand Logo (Horizontal)</div>
    <img src="/skillbridge-navbar-brand.svg" width="380" alt="Brand Logo">
    <p style="font-size: 12px; color: #94a3b8; margin: 0;">File: public/skillbridge-navbar-brand.svg</p>
  </div>

</body>
</html>
